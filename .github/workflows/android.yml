name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scanner-APK
          path: Scanner.apk

      # Feste Download-Adresse für das Handy:
      # https://github.com/<konto>/<repo>/releases/download/android-latest/Scanner.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Scanner-App (neueste Version)
          body: "Automatisch gebaut aus Commit ${{ github.sha }}. Auf dem Handy herunterladen und installieren."
          files: Scanner.apk
          make_latest: true
